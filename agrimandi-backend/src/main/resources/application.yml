spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: agrimandi-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agrimandi}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:8b3e2b26a6e8b7b25c11f435dbb277b9492167d4f820c74f51e36787889ac2a023773b0f5b128c7f9996d9943632ab30}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}

server:
  port: 8080
  error:
    include-message: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
